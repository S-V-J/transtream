{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0f172a"/>

    <title>{% block title %}TranStream{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2/dist/htmx.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <script src="{% static 'js/app.js' %}" defer></script>
</head>

<body class="h-full bg-slate-950 text-slate-100 antialiased">

<header class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-slate-900/80 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">

        <a href="{% url 'studio:studio' %}" class="flex items-center gap-2 text-base font-semibold tracking-tight">
            <span>🎙️</span>
            <span>TranStream</span>
        </a>

        <nav class="flex flex-wrap items-center gap-1 text-sm">
            <a href="{% url 'studio:studio' %}"
               class="rounded-md px-3 py-2 transition {% if page == 'studio' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                Studio
            </a>

            <a href="{% url 'studio:settings' %}"
               class="rounded-md px-3 py-2 transition {% if page == 'settings' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                Settings
            </a>

            <a href="{% url 'studio:account' %}"
               class="rounded-md px-3 py-2 transition {% if page == 'account' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                MyAccount
            </a>

            <a href="{% url 'studio:about' %}"
               class="rounded-md px-3 py-2 transition {% if page == 'about' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                About App
            </a>
        </nav>

        <div class="flex items-center gap-3">
            <span class="hidden text-xs text-slate-400 sm:inline">
                {{ user.username }}
            </span>

            <form method="post" action="{% url 'logout' %}" class="inline">
                {% csrf_token %}
                <button
                    type="submit"
                    class="rounded-md border border-white/10 bg-slate-800/60 px-3 py-1.5 text-xs font-medium text-slate-300 transition hover:bg-rose-600/20 hover:text-rose-300"
                >
                    Sign Out
                </button>
            </form>
        </div>

    </div>
</header>

<main class="pt-24 pb-12">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </div>
</main>

{% block extra_scripts %}{% endblock %}

</body>
</html>
