{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0f172a"/>
    <title>Login | TranStream</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex h-full items-center justify-center bg-slate-950 text-slate-100 antialiased">

<div class="w-full max-w-md px-6">

    <div class="mb-8 text-center">
        <span class="text-4xl">🎙️</span>
        <h1 class="mt-3 text-2xl font-bold tracking-tight text-white">TranStream</h1>
        <p class="mt-1 text-sm text-slate-400">Sign in to your local audio studio</p>
    </div>

    <form method="post" action="{% url 'login' %}" class="space-y-5">
        {% csrf_token %}

        {% if form.non_field_errors %}
        <div class="rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-300">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <div>
            <label for="id_username" class="mb-1 block text-sm font-medium text-slate-300">
                Username
            </label>
            <input
                type="text"
                name="username"
                id="id_username"
                autofocus
                required
                autocomplete="username"
                class="w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white outline-none transition focus:border-cyan-500/60 focus:ring-1 focus:ring-cyan-500/30"
                placeholder="Enter your username"
            />
        </div>

        <div>
            <label for="id_password" class="mb-1 block text-sm font-medium text-slate-300">
                Password
            </label>
            <input
                type="password"
                name="password"
                id="id_password"
                required
                autocomplete="current-password"
                class="w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white outline-none transition focus:border-cyan-500/60 focus:ring-1 focus:ring-cyan-500/30"
                placeholder="Enter your password"
            />
        </div>

        <input type="hidden" name="next" value="{{ next|default:'/studio/' }}"/>

        <button
            type="submit"
            class="w-full rounded-xl bg-cyan-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
        >
            Sign In
        </button>
    </form>

    <p class="mt-6 text-center text-xs text-slate-500">
        Local-first · No cloud · No external APIs
    </p>

</div>

</body>
</html>
